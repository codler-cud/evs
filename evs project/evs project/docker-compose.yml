version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecosort-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ecosort.db
      - SECRET_KEY=${SECRET_KEY:-dev-only-change-in-production}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - SEED_DEMO_DATA=true
    volumes:
      - ecosort_db:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecosort-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  ecosort_db:
